# Runs the tests on every pull request and on pushes to main and the checkpoint branches.
# Under Glass (sim/) is game-free on .NET 8. The mod's libraries (src/, tests/) are game-free too and
# target .NET 6; the mod itself (mod/StardewNpcMod) compiles against the installed game, so CI never
# builds it: that check stays on Sid's PC (AGENTS.md, "Tests").
name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - 'claude/checkpoint-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reflection-generator:
    name: Reflection generator contracts (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install HTTP test dependencies
        run: python -m pip install -r sim/tools/generator-test-requirements.txt
      - name: Test without a model or GPU
        run: python -m unittest discover -s tests -p test_reflection_generator.py
      - name: Test the Claude generator contract without the SDK, credentials or network
        run: python -m unittest discover -s tests -p test_claude_generator.py
      - name: Test dialogue corpus parsing without the game
        run: python -m unittest discover -s tests -p test_stardew_dialogue_corpus.py
      - name: Test the Laya categorization probe without a server
        run: python -m unittest discover -s tests -p test_laya_categorize_probe.py
      - name: Test the local run service and CLI option coverage
        run: python -m unittest discover -s tests -p test_preview_server.py
      - name: Test model service ownership and startup without models
        run: python -m unittest discover -s tests -p test_studio_services.py

  under-glass:
    name: Under Glass (sim)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test viewer timeline behavior
        run: node --test sim/tools/test-viewer-timeline.cjs
      - name: Test contextual encounters and rewind behavior
        run: node --test sim/tools/test-viewer-encounters.cjs
      - name: Test fixed-intention wording viewer
        run: node --test sim/tools/test-viewer-wording.cjs
      - name: Test spoken lines follow the clock in the viewer
        run: node --test sim/tools/test-viewer-speech.cjs
      - name: Test errands read in the viewer
        run: node --test sim/tools/test-viewer-errands.cjs
      - name: Test the speech coverage page agrees with the selector
        run: node --test sim/tools/test-speech-page.cjs
      - name: Test navigation between observer tools
        run: node --test sim/tools/test-tool-navigation.cjs sim/tools/test-tool-ui.cjs sim/tools/test-archetypes.cjs sim/tools/test-chains.cjs
      - name: Test observer pack provenance without model calls
        shell: pwsh
        run: ./sim/tools/test-observer-pack.ps1
      - name: Restore
        run: dotnet restore sim/UnderGlass.sln
      - name: Build
        run: dotnet build sim/UnderGlass.sln -c Release --no-restore
      - name: Test
        run: dotnet test sim/UnderGlass.sln -c Release --no-build --logger "trx;LogFileName=sim.trx" --results-directory test-results
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-test-results
          path: test-results
          if-no-files-found: ignore

  mod-libraries:
    name: Mod libraries (src, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - name: Test each library
        shell: bash
        run: |
          set -euo pipefail
          for project in tests/*/*.Tests.csproj; do
            echo "::group::$project"
            dotnet test "$project" -c Release --logger "trx;LogFilePrefix=$(basename "$project" .csproj)" --results-directory test-results
            echo "::endgroup::"
          done
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mod-test-results
          path: test-results
          if-no-files-found: ignore
